<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="190" stroke="url(#primaryGrad)" stroke-width="6" fill="none" opacity="0.4" />
  
  <!-- ZXR Emblem Shape -->
  <g filter="url(#glow)">
    <!-- Play Triangle with glowing modern futuristic curve -->
    <path d="M 190 150 L 370 256 L 190 362 Z" fill="url(#primaryGrad)" />
    <!-- Crescent Arabic Cinema Touch -->
    <path d="M 330 180 C 370 220 370 290 330 330 C 310 310 310 200 330 180 Z" fill="#ffffff" opacity="0.8" />
  </g>
  
  <!-- Text Label -->
  <text x="256" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="4">ZXR STREAM</text>
  <text x="256" y="475" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="22" fill="#a5b4fc">إضافات عربية</text>
</svg>
